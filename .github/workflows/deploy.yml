name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once; queue the newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/imanirumvaolivier20-a11y/piramid

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS secrets
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::VPS_HOST, VPS_USER or VPS_SSH_KEY is not set. Image was built but not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy compose file
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /var/www/apps/piramid"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/var/www/apps/piramid/docker-compose.prod.yml"

      - name: Pull and restart
        if: steps.check.outputs.ready == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'EOF'
          set -euo pipefail
          cd /var/www/apps/piramid
          if [ ! -f .env ]; then
            echo "/var/www/apps/piramid/.env is missing on the VPS. Create it from .env.example first." >&2
            exit 1
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker logout ghcr.io

          # Only remove old Pyramid images; other apps on this VPS are left alone.
          docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/imanirumvaolivier20-a11y/piramid"

          port=$(grep -E '^APP_PORT=' .env | cut -d= -f2 || true)
          port=${port:-3100}
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$port/api/health"; then
              echo
              echo "Deployed and healthy on port $port."
              exit 0
            fi
            sleep 3
          done
          echo "App did not become healthy." >&2
          docker compose -f docker-compose.prod.yml logs --tail 50 app
          exit 1
          EOF
