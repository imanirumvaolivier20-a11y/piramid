# Production stack on the VPS. Copied there by the deploy workflow; reads /var/www/apps/piramid/.env.
name: piramid

services:
  app:
    image: ghcr.io/imanirumvaolivier20-a11y/piramid:latest
    restart: unless-stopped
    ports:
      # The VPS hosts other apps, so we stay off 80/443 and publish a dedicated port.
      - "${APP_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgresql://piramid:${POSTGRES_PASSWORD}@db:5432/piramid
      AUTH_SECRET: ${AUTH_SECRET}
      # Public URL of the site, needed once Google sign-in is enabled (e.g. https://pyramid.example.com).
      AUTH_URL: ${AUTH_URL:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Not published on the host: only the app container can reach it.
    environment:
      POSTGRES_DB: piramid
      POSTGRES_USER: piramid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piramid -d piramid"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pg_data:
  uploads:
