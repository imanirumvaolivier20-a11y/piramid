# Local development: runs only PostgreSQL. Start the app itself with `npm run dev`.
name: piramid-dev

services:
  db:
    image: postgres:17-alpine
    ports:
      # 5433 on the host so it does not clash with a locally installed PostgreSQL.
      - "5433:5432"
    environment:
      POSTGRES_DB: piramid
      POSTGRES_USER: piramid
      POSTGRES_PASSWORD: piramid
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
